# Gray-Black — порт Ghostty/GrayBlack для Alacritty.
# Серо-чёрный фон без синего оттенка.

[colors.primary]
background = "#050505"
foreground = "#e6e6e6"

[colors.cursor]
text   = "#050505"
cursor = "#f6c177"

[colors.selection]
text       = "#e6e6e6"
background = "#3a3a3a"

# Normal (0–7) — нейтральная серая база, без синевы
[colors.normal]
black   = "#2a2a2a"
red     = "#eb6f92"
green   = "#9ccfd8"
yellow  = "#f6c177"
blue    = "#b59ad8"
magenta = "#ea9a97"
cyan    = "#a0a0a0"
white   = "#d6d6d6"

# Bright (8–15)
[colors.bright]
black   = "#6e6e6e"
red     = "#eb6f92"
green   = "#9ccfd8"
yellow  = "#f6c177"
blue    = "#c4a7e7"
magenta = "#ea9a97"
cyan    = "#b8b8b8"
white   = "#e6e6e6"
