# XDR Pitch Black — порт Ghostty/XDRBlack для Alacritty.
# Настоящий чёрный фон под Apple XDR / mini-LED / OLED, чтобы пиксели
# гасились до минимума яркости.

[colors.primary]
background = "#000000"
foreground = "#e8e8e8"

[colors.cursor]
text   = "#000000"
cursor = "#ffffff"

[colors.selection]
text       = "#ffffff"
background = "#2a2a2a"

# Normal (0–7)
[colors.normal]
black   = "#1a1a1a"
red     = "#ff5d62"
green   = "#76d7b8"
yellow  = "#ffb86c"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

# Bright (8–15)
[colors.bright]
black   = "#444444"
red     = "#ff7a85"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7dcfff"
magenta = "#bb9af7"
cyan    = "#73daca"
white   = "#ffffff"
